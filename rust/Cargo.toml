[package]
name = "astra-local-team"
version = "0.3.1"
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-only"
description = "The Council of Coding: local model proposals with supervisor review"
repository = "https://github.com/Ajbevan-create/the-council-of-coding"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
fs2 = "0.4"
