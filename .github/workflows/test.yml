name: Native portability checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install stable Rust
        run: rustup update stable
      - name: Rust validation, locking, and resume tests
        run: cargo +stable test --locked --manifest-path rust/Cargo.toml
      - name: Installer and MCP contract tests
        run: python -m unittest discover -s tests -v
      - name: Verify source checksums after native checkout
        run: python -c "import sys; sys.path.insert(0, 'scripts'); import install; install.verify_package()"
      - name: Build native runner
        run: cargo +stable build --release --locked --manifest-path rust/Cargo.toml
